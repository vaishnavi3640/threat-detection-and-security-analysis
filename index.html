<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d14">
  <meta name="description" content="Web Shield combines authorized website security and privacy assessment in one workspace.">
  <title>WebShield — Website Security &amp; Privacy</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#dashboard" data-page="dashboard" aria-label="Web Shield home"><span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M12 2.5 20 5.4v6.2c0 5.1-3.4 8.6-8 10.8-4.6-2.2-8-5.7-8-10.8V5.4L12 2.5Z"/><path d="m8.7 12.2 2.2 2.1 4.5-4.7"/></svg></span><span>Web <b>Shield</b></span></a>
      <div class="workspace-label">WORKSPACE</div>
      <button class="workspace-select">Acme Studio <span>⌄</span></button>
      <nav class="side-nav" aria-label="Workspace navigation">
        <button data-page="dashboard"><span class="nav-icon">▦</span>Dashboard</button>
        <button data-page="scan" class="active"><span class="nav-icon">⛶</span>Scan Website</button>
        <button data-page="surface"><span class="nav-icon">◉</span>Attack Surface</button>
        <button data-page="security"><span class="nav-icon">♢</span>Security Analysis</button>
        <button data-page="privacy"><span class="nav-icon">◉</span>Privacy Analysis</button>
        <button data-page="weaknesses"><span class="nav-icon">♙</span>Weaknesses <span class="nav-count">5</span></button>
        <button data-page="hardening"><span class="nav-icon">⚒</span>Security Hardening</button>
        <button data-page="reassessment"><span class="nav-icon">⇄</span>Reassessment</button>
        <button data-page="reports"><span class="nav-icon">▤</span>Reports</button>
        <button data-page="history"><span class="nav-icon">◷</span>History</button>
        <button data-page="settings"><span class="nav-icon">⚙</span>Settings</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="trust-note"><span class="sparkle">✧</span><strong>Build more trust</strong><p>Resolve priority risks with guided fixes.</p></div>
        <div class="profile"><span class="avatar">AP</span><span><b>Aditi Panchal</b><small>Capstone workspace</small></span><span class="more">···</span></div>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar"><div class="top-brand"><span class="brand-mark small"><svg viewBox="0 0 24 24"><path d="M12 2.5 20 5.4v6.2c0 5.1-3.4 8.6-8 10.8-4.6-2.2-8-5.7-8-10.8V5.4L12 2.5Z"/><path d="m8.7 12.2 2.2 2.1 4.5-4.7"/></svg></span>Web Shield</div><nav class="top-nav"><button data-page="dashboard">Dashboard</button><button data-page="scan">Assessments</button><button data-page="reports">Global Reports</button><button data-page="surface">Threat Feed</button><button data-page="history">Service Desk</button><button data-page="security">Risk</button></nav><div class="top-status"><span class="threat-badge">🟢 Low Threat</span><span class="last-updated" id="last-updated"></span></div><div class="top-actions"><button aria-label="Search">⌕</button><button aria-label="Notifications">♧<i></i></button><button aria-label="Profile">♙</button></div></header>
      <div class="crumbbar"><div><span>WebShield</span><b>›</b><strong id="crumb">Scan Website</strong></div><div class="crumb-actions"><button aria-label="Search">⌕</button><button aria-label="Notifications">♧</button><span class="avatar">AP</span></div></div>
      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <div id="modal-root"></div>
  <script src="app.js"></script>
</body>
</html>
