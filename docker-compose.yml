version: '3.9'
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./threatguard:/app/threatguard
    environment:
      - DATABASE_URL=sqlite:////app/threatguard/threatguard.db
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
