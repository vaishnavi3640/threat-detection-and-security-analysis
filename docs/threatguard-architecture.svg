<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">ThreatGuard architecture</title>
  <desc id="desc">Layered architecture for the ThreatGuard website security and privacy analyzer. An authorized owner submits a URL through the React application. The Flask backend validates the target, runs passive security and privacy checks, scores findings, stores results, and returns dashboard, report, and reassessment information to the user interface.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#183a70"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#18856b"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#182a43}
      .banner{fill:#162d57}.banner-title{fill:#fff;font-size:34px;font-weight:700}.banner-sub{fill:#dbe8ff;font-size:17px}
      .page-title{font-size:38px;font-weight:700}.column-title{fill:#fff;font-size:21px;font-weight:700}
      .section{font-size:19px;font-weight:700}.body{font-size:16px;fill:#293c55}.small{font-size:14px;fill:#40546d}
      .col{fill:#f8fbff;stroke:#294c83;stroke-width:2.5}.head{fill:#203d73}
      .blue{fill:#e4f0ff;stroke:#81a9e5;stroke-width:1.7}.violet{fill:#f0eaff;stroke:#a68cde;stroke-width:1.7}
      .green{fill:#e7f5ed;stroke:#84c29b;stroke-width:1.7}.orange{fill:#fff0e3;stroke:#e7aa70;stroke-width:1.7}
      .infra{fill:#e9f0ff;stroke:#294c83;stroke-width:2.5}.inner{fill:#fff;stroke:#a9bdd8;stroke-width:1.5}
      .edge{fill:none;stroke:#183a70;stroke-width:4;marker-end:url(#arrow)}
      .edge-green{fill:none;stroke:#18856b;stroke-width:3.5;marker-end:url(#arrow-green)}
      .dashed{fill:none;stroke:#687f9d;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow)}
      .line{stroke:#d0dced;stroke-width:1.3}
    </style>
  </defs>

  <rect width="1800" height="1080" fill="#f4f8ff"/>
  <path d="M0 210 C180 130 280 200 430 150 L430 0 H0 Z" fill="#e7f1ff" opacity=".8"/>
  <path d="M1800 205 C1650 115 1540 200 1390 145 L1390 0 H1800 Z" fill="#e7f1ff" opacity=".8"/>
  <rect x="355" y="22" width="1090" height="94" rx="27" class="banner"/>
  <path d="M411 45 L441 32 L471 45 L468 73 Q464 93 441 104 Q418 93 414 73 Z" fill="none" stroke="#58d5a0" stroke-width="6"/>
  <path d="M432 66 v-6 a9 9 0 0 1 18 0 v6 M429 66 h24 v19 h-24 z" fill="none" stroke="#8ce4bf" stroke-width="4"/>
  <text x="495" y="62" class="banner-title">ThreatGuard — Website Security Analyzer</text>
  <text x="660" y="92" class="banner-sub">Assess  •  Understand  •  Improve</text>
  <text x="48" y="178" class="page-title">Architecture</text>
  <line x1="392" y1="165" x2="1748" y2="165" stroke="#315d9b" stroke-width="3"/>

  <!-- Stage 1: owner and scan request -->
  <rect x="35" y="220" width="230" height="440" rx="18" class="col"/>
  <path d="M53 220 H247 Q265 220 265 238 V270 H35 V238 Q35 220 53 220Z" class="head"/>
  <text x="150" y="253" class="column-title" text-anchor="middle">User &amp; Input</text>
  <circle cx="150" cy="320" r="34" fill="#dceaff" stroke="#7395cc" stroke-width="2"/>
  <circle cx="150" cy="310" r="11" fill="#254779"/><path d="M127 348 Q130 325 150 325 Q170 325 173 348Z" fill="#254779"/>
  <text x="150" y="382" class="section" text-anchor="middle">Website owner</text>
  <text x="150" y="409" class="small" text-anchor="middle">Owns or may assess the site</text>
  <line x1="57" y1="430" x2="243" y2="430" class="line"/>
  <rect x="54" y="451" width="192" height="92" rx="13" class="blue"/>
  <text x="150" y="480" class="section" text-anchor="middle">Scan request</text>
  <text x="150" y="507" class="small" text-anchor="middle">Website URL + start scan</text>
  <text x="150" y="568" class="small" text-anchor="middle">Submitted in the web app</text>
  <text x="150" y="597" class="small" text-anchor="middle">Authorized targets only</text>

  <!-- Stage 2: collection and safeguards -->
  <rect x="300" y="220" width="350" height="440" rx="18" class="col"/>
  <path d="M318 220 H632 Q650 220 650 238 V270 H300 V238 Q300 220 318 220Z" class="head"/>
  <text x="475" y="253" class="column-title" text-anchor="middle">Data Collection Layer</text>
  <rect x="319" y="289" width="312" height="76" rx="12" class="blue"/>
  <text x="338" y="319" class="section">Flask API intake</text>
  <text x="338" y="346" class="small">Authenticates request and starts scan</text>
  <rect x="319" y="379" width="312" height="93" rx="12" class="orange"/>
  <text x="338" y="410" class="section">Target safety validation</text>
  <text x="338" y="437" class="small">URL validation, private-target blocks,</text>
  <text x="338" y="458" class="small">and restricted development demo opt-in</text>
  <rect x="319" y="486" width="312" height="76" rx="12" class="blue"/>
  <text x="338" y="516" class="section">Website response collection</text>
  <text x="338" y="543" class="small">HTTP response and page observations</text>
  <rect x="319" y="576" width="312" height="62" rx="12" class="inner"/>
  <text x="338" y="602" class="small">Read-only requests; no exploit attempts</text>
  <text x="338" y="624" class="small">or destructive changes</text>

  <!-- Stage 3: analysis modules -->
  <rect x="690" y="190" width="365" height="500" rx="18" class="col"/>
  <path d="M708 190 H1037 Q1055 190 1055 208 V240 H690 V208 Q690 190 708 190Z" class="head"/>
  <text x="872" y="223" class="column-title" text-anchor="middle">Analysis Engine</text>
  <rect x="710" y="258" width="325" height="94" rx="13" class="violet"/>
  <text x="731" y="290" class="section">Security finding detection</text>
  <text x="731" y="319" class="small">HTTPS/TLS, headers, cookies,</text>
  <text x="731" y="340" class="small">and observable server signals</text>
  <rect x="710" y="365" width="325" height="94" rx="13" class="green"/>
  <text x="731" y="397" class="section">Privacy analysis</text>
  <text x="731" y="426" class="small">Cookies, third-party requests,</text>
  <text x="731" y="447" class="small">and privacy-policy observations</text>
  <rect x="710" y="472" width="325" height="94" rx="13" class="blue"/>
  <text x="731" y="504" class="section">Risk &amp; score calculation</text>
  <text x="731" y="533" class="small">Severity, security, privacy,</text>
  <text x="731" y="554" class="small">and overall trust scores</text>
  <rect x="710" y="579" width="325" height="90" rx="13" class="orange"/>
  <text x="731" y="611" class="section">Guidance &amp; explanations</text>
  <text x="731" y="639" class="small">Prioritized fixes; optional Groq AI</text>
  <text x="731" y="660" class="small">explanations when configured</text>

  <!-- Stage 4: results and presentation -->
  <rect x="1095" y="220" width="330" height="440" rx="18" class="col"/>
  <path d="M1113 220 H1407 Q1425 220 1425 238 V270 H1095 V238 Q1095 220 1113 220Z" class="head"/>
  <text x="1260" y="253" class="column-title" text-anchor="middle">Results &amp; Presentation</text>
  <rect x="1115" y="289" width="290" height="79" rx="12" class="blue"/>
  <text x="1135" y="320" class="section">Security dashboard</text>
  <text x="1135" y="347" class="small">Scores, findings, and key insights</text>
  <rect x="1115" y="382" width="290" height="79" rx="12" class="blue"/>
  <text x="1135" y="413" class="section">Detailed PDF report</text>
  <text x="1135" y="440" class="small">Exportable assessment results</text>
  <rect x="1115" y="475" width="290" height="79" rx="12" class="green"/>
  <text x="1135" y="506" class="section">Reassessment comparison</text>
  <text x="1135" y="533" class="small">Resolved, new, and remaining issues</text>
  <rect x="1115" y="568" width="290" height="70" rx="12" class="orange"/>
  <text x="1135" y="598" class="section">Fix guidance &amp; history</text>
  <text x="1135" y="623" class="small">Track scans and recommended actions</text>

  <!-- Stage 5: user-facing frontend -->
  <rect x="1465" y="220" width="300" height="440" rx="18" class="col"/>
  <path d="M1483 220 H1747 Q1765 220 1765 238 V270 H1465 V238 Q1465 220 1483 220Z" class="head"/>
  <text x="1615" y="253" class="column-title" text-anchor="middle">User Interface</text>
  <rect x="1490" y="300" width="250" height="125" rx="13" class="blue"/>
  <rect x="1520" y="320" width="190" height="75" rx="8" fill="#fff" stroke="#7395cc" stroke-width="2"/>
  <path d="M1540 378 h150 M1553 363 l24-16 23 9 27-22 31 14" fill="none" stroke="#238a78" stroke-width="4"/>
  <text x="1615" y="415" class="small" text-anchor="middle">React + Vite web workspace</text>
  <text x="1500" y="468" class="section">Pages present results:</text>
  <text x="1505" y="500" class="body">✓ Scan and assessment</text>
  <text x="1505" y="530" class="body">✓ Security and privacy</text>
  <text x="1505" y="560" class="body">✓ Weaknesses and hardening</text>
  <text x="1505" y="590" class="body">✓ Reports and reassessment</text>
  <text x="1615" y="632" class="small" text-anchor="middle">Findings return to the owner</text>

  <!-- Main flow arrows -->
  <path d="M265 438 H290" class="edge"/>
  <path d="M650 438 H680" class="edge"/>
  <path d="M1055 438 H1085" class="edge"/>
  <path d="M1425 438 H1455" class="edge"/>

  <!-- Infrastructure band -->
  <rect x="95" y="760" width="1610" height="225" rx="20" class="infra"/>
  <rect x="650" y="735" width="500" height="54" rx="20" class="head"/>
  <text x="900" y="770" class="column-title" text-anchor="middle">Runtime &amp; Infrastructure Layer</text>
  <line x1="495" y1="815" x2="495" y2="950" stroke="#9db1d1" stroke-width="2"/>
  <line x1="900" y1="815" x2="900" y2="950" stroke="#9db1d1" stroke-width="2"/>
  <line x1="1300" y1="815" x2="1300" y2="950" stroke="#9db1d1" stroke-width="2"/>

  <text x="145" y="841" class="section">Frontend</text>
  <text x="145" y="875" class="body">React + Vite</text>
  <text x="145" y="904" class="small">Browser-based workspace and results</text>
  <text x="145" y="932" class="small">Development UI: localhost:3000</text>

  <text x="545" y="841" class="section">Backend service</text>
  <text x="545" y="875" class="body">Flask REST API + scan workers</text>
  <text x="545" y="904" class="small">Python scanning and report modules</text>
  <text x="545" y="932" class="small">Local API port is configurable</text>

  <text x="950" y="841" class="section">Database</text>
  <text x="950" y="875" class="body">SQLAlchemy + SQLite default</text>
  <text x="950" y="904" class="small">Persists users, sites, scans, findings,</text>
  <text x="950" y="932" class="small">reports; MySQL schema is a reference</text>

  <text x="1350" y="841" class="section">Optional integrations &amp; demo</text>
  <text x="1350" y="875" class="body">Groq API for AI explanations</text>
  <text x="1350" y="904" class="small">Local demo: explicit development-only</text>
  <text x="1350" y="932" class="small">loopback opt-in; private targets stay blocked</text>

  <!-- Components connect to shared runtime/storage -->
  <path d="M475 660 V710 H700 V750" class="dashed"/>
  <path d="M872 690 V725 H1100 V750" class="dashed"/>
  <path d="M1260 660 V700 H700 V750" class="dashed"/>
  <path d="M1615 660 V710 H295 V750" class="dashed"/>

  <rect x="95" y="1008" width="1610" height="48" rx="12" fill="#fff" stroke="#c9d7e8" stroke-width="1.5"/>
  <text x="900" y="1038" class="small" text-anchor="middle">Passive assessment for authorized websites only. No exploit attempts or destructive changes.</text>
</svg>
